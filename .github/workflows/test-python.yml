name: Grade Python Pull Request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  grade:
    name: Grade Submitted Python Problems
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Check out submitted PR code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          path: student

      - name: Check out instructor test cases
        uses: actions/checkout@v4
        with:
          ref: tests
          persist-credentials: false
          path: grader

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest pytest-timeout

      - name: Grade only changed assignment files
        env:
          PYTHONPATH: ${{ github.workspace }}/student
          PYTHONDONTWRITEBYTECODE: '1'
        run: python grader/run_changed_tests.py student

      - name: Display scores for submitted problems
        if: always()
        run: python grader/grading_report.py results.xml grading_selection.json
